<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Chinmay Pandey | Product Builder</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #FAF8F5;
        color: #1A1A1A;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
    </style>
    <script type="text/javascript">
      (function() {
        var path = window.location.pathname;
        var repoName = '/chinmay-portfolio/';
        if (path && path !== repoName && path !== repoName + 'index.html') {
          var route = path.indexOf(repoName) === 0 ? path.slice(repoName.length) : path;
          if (route && route !== 'index.html') {
            window.location.replace(repoName + '?p=' + encodeURIComponent(route) + window.location.hash);
            return;
          }
        }
        window.location.replace(repoName + window.location.hash);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
