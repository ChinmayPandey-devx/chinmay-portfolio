<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect to index.html for SPA routing
      var path = window.location.pathname;
      var repoName = '/chinmay-portfolio/';
      if (path !== repoName) {
        window.location.replace(repoName + '?p=' + path.replace(repoName, ''));
      } else {
        window.location.replace(repoName);
      }
    </script>
  </head>
  <body>
  </body>
</html>
