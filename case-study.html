<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study | Chinmay Pandey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .case-study-container {
            max-width: 800px;
            margin: 120px auto 60px;
            padding: 0 var(--spacing-lg);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xl);
            font-weight: 500;
        }
        .back-link:hover { color: var(--text-primary); }
        .case-title {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
        }
        .case-content-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-primary);
        }
        .case-content-body h3 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        .case-content-body p { margin-bottom: 1.5rem; color: var(--text-secondary); }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">CP.</a>
            <div class="nav-links">
                <a href="index.html#portfolio">Back to Portfolio</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                   <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="case-study-container fade-in-up">
        <a href="index.html#portfolio" class="back-link">← Back to Portfolio</a>
        <br>
        <span id="case-category" class="project-category"></span>
        <h1 id="case-title" class="case-title">Loading...</h1>
        <div id="case-skills" class="project-skills" style="margin-bottom: 2rem;"></div>
        <div id="case-body" class="case-content-body"></div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Chinmay Pandey.</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="case_content.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = parseInt(urlParams.get('id'));
            
            const project = projects.find(p => p.id === id);
            
            if (project) {
                document.title = project.title + " | Chinmay Pandey";
                document.getElementById('case-title').textContent = project.title;
                document.getElementById('case-category').textContent = project.category;
                
                const skillsContainer = document.getElementById('case-skills');
                project.skills.forEach(skill => {
                    const span = document.createElement('span');
                    span.className = 'skill-tag';
                    span.textContent = skill;
                    skillsContainer.appendChild(span);
                });
                
                let contentText = "Content could not be loaded.";
                if (typeof caseContent !== 'undefined' && caseContent[id]) {
                    contentText = caseContent[id];
                }
                
                // Format text into HTML
                const formattedHtml = contentText.split('\\n\\n').map(p => {
                    p = p.trim();
                    if (p.length === 0) return '';
                    // bold short lines
                    if (p.length < 80 && !p.includes('.')) {
                        return '<h3>' + p.replace(/\\n/g, '<br>') + '</h3>';
                    }
                    return '<p>' + p.replace(/\\n/g, '<br>') + '</p>';
                }).join('');
                
                document.getElementById('case-body').innerHTML = formattedHtml;
            } else {
                document.getElementById('case-title').textContent = "Case Study Not Found";
            }

            // Theme Toggle logic
            const themeToggleBtn = document.getElementById('theme-toggle');
            const htmlEl = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlEl.classList.add('dark');
            }
            themeToggleBtn.addEventListener('click', () => {
                htmlEl.classList.toggle('dark');
                localStorage.setItem('theme', htmlEl.classList.contains('dark') ? 'dark' : 'light');
            });
        });
    </script>
</body>
</html>
